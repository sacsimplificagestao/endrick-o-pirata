<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Endrick O Pirata</title>
<meta name="description" content="Links oficiais de Endrick O Pirata. Escute, assista e contrate shows." />
<meta name="theme-color" content="#e8f3ff" />

<!-- Open Graph / compartilhamento -->
<meta property="og:title" content="Endrick O Pirata" />
<meta property="og:description" content="Escute no Spotify, assista Brega do Pirata 1.0 e contrate shows." />
<meta property="og:image" content="assets/avatar.jpg" />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#eef5ff;            /* azul muito claro / branco */
    --bg2:#ffffff;
    --blue:#1466ff;          /* azul principal */
    --blue-2:#00b3ff;        /* azul ciano */
    --blue-3:#0a3aa8;        /* azul escuro */
    --ink:#0b2a5b;           /* texto azul-escuro */
    --muted:#5b7bb0;
    --card:#ffffff;
    --card-brd:rgba(20,102,255,.22);
    --maxw:480px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Rajdhani',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  /* ===== FUNDO (azul claro animado) ===== */
  .bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .grid{
    position:absolute;left:-50%;right:-50%;bottom:-10%;height:70%;
    background-image:
      linear-gradient(rgba(20,102,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,179,255,.08) 1px, transparent 1px);
    background-size:46px 46px;
    transform:perspective(340px) rotateX(62deg);
    transform-origin:bottom center;
    mask-image:linear-gradient(to top, #000 0%, transparent 85%);
    -webkit-mask-image:linear-gradient(to top, #000 0%, transparent 85%);
    animation:gridmove 14s linear infinite;
  }
  @keyframes gridmove{from{background-position:0 0,0 0;}to{background-position:0 46px,46px 0;}}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;}
  .orb.a{width:360px;height:360px;background:var(--blue-2);top:-100px;left:-90px;animation:float1 11s ease-in-out infinite;}
  .orb.b{width:320px;height:320px;background:var(--blue);top:28%;right:-120px;opacity:.35;animation:float2 13s ease-in-out infinite;}
  .orb.c{width:300px;height:300px;background:#7cc4ff;bottom:-90px;left:18%;opacity:.4;animation:float1 15s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(34px) translateX(20px);}}
  @keyframes float2{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-30px) translateX(-22px);}}
  /* clareia as bordas (mantém vibe branca) */
  .bg-layer::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%, transparent 30%, rgba(238,245,255,.9) 100%);}

  /* ===== CONTAINER (modo celular) ===== */
  .phone{
    position:relative;z-index:1;
    width:100%;max-width:var(--maxw);
    min-height:100dvh;
    padding:clamp(26px,7vw,44px) clamp(20px,5vw,30px) 40px;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }

  /* ===== LOGO (texto estilizado) ===== */
  .logo{margin-top:6px;animation:logoIn .9s cubic-bezier(.2,.9,.2,1) both;}
  .logo .l1{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(34px,10vw,52px);line-height:.92;letter-spacing:2px;
    text-transform:uppercase;
    background:linear-gradient(180deg,var(--blue),var(--blue-3));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 8px rgba(20,102,255,.25));
  }
  .logo .l2{
    font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:clamp(13px,3.4vw,18px);letter-spacing:8px;
    text-transform:uppercase;color:var(--blue-2);margin-top:4px;
    text-shadow:0 0 14px rgba(0,179,255,.4);
  }
  @keyframes logoIn{from{opacity:0;transform:translateY(-18px) scale(.94);}to{opacity:1;transform:none;}}

  /* ===== AVATAR (player tocando) ===== */
  .photo-wrap{
    margin-top:28px;position:relative;
    width:clamp(160px,46vw,196px);aspect-ratio:1/1;
    border-radius:50%;
    display:grid;place-items:center;
    animation:photoIn .9s .15s cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes photoIn{from{opacity:0;transform:scale(.8);}to{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .photo-wrap::before{
    content:"";position:absolute;inset:0;border-radius:50%;z-index:0;
    background:conic-gradient(from 0deg,var(--blue),var(--blue-2),#7cc4ff,var(--blue-2),var(--blue));
    animation:spin 5s linear infinite, ringGlow 4s ease-in-out 1s infinite;
  }
  @keyframes ringGlow{0%,100%{box-shadow:0 0 24px rgba(20,102,255,.35);}50%{box-shadow:0 0 40px rgba(0,179,255,.55);}}
  .pulse{position:absolute;inset:0;border-radius:50%;z-index:0;border:2px solid var(--blue-2);animation:wave 2.6s ease-out infinite;}
  .pulse.d2{animation-delay:1.3s;}
  @keyframes wave{0%{transform:scale(.96);opacity:.5;}100%{transform:scale(1.42);opacity:0;}}

  /* FOTO estática (placeholder até você adicionar) */
  .photo-wrap img{
    position:relative;z-index:1;
    width:calc(100% - 8px);height:calc(100% - 8px);
    object-fit:cover;object-position:50% 38%;
    border-radius:50%;display:block;
    border:3px solid var(--bg2);background:var(--bg2);
  }
  .photo-wrap.noimg .ph{
    position:relative;z-index:1;
    width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;
    border:3px solid var(--bg2);
    background:linear-gradient(160deg,#dbeafe,#bfdbfe);
    display:grid;place-items:center;color:var(--blue-3);
    font-weight:600;font-size:13px;gap:2px;text-align:center;line-height:1.2;
  }
  .photo-wrap.noimg .ph b{font-size:26px;}

  /* equalizer (player tocando) */
  .eq{
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;align-items:flex-end;gap:3px;height:18px;
    padding:5px 9px;border-radius:99px;
    background:#fff;border:1px solid var(--card-brd);
    box-shadow:0 4px 14px -4px rgba(20,102,255,.5);
  }
  .eq i{width:3px;height:100%;border-radius:2px;background:var(--blue);transform-origin:bottom;animation:eq .9s ease-in-out infinite;}
  .eq i:nth-child(2){animation-delay:.18s;background:var(--blue-2);}
  .eq i:nth-child(3){animation-delay:.36s;}
  .eq i:nth-child(4){animation-delay:.54s;background:var(--blue-2);}
  .eq i:nth-child(5){animation-delay:.72s;}
  @keyframes eq{0%,100%{transform:scaleY(.28);}50%{transform:scaleY(1);}}

  /* selo */
  .live{
    position:absolute;top:6px;right:0;z-index:3;
    display:flex;align-items:center;gap:5px;
    background:#fff;border:1px solid var(--blue);
    color:var(--blue);font-weight:700;font-size:10px;letter-spacing:1px;
    padding:4px 9px;border-radius:99px;
    box-shadow:0 4px 12px -3px rgba(20,102,255,.5);
  }
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);animation:livedot 1.4s ease-in-out infinite;}
  @keyframes livedot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.7);}}

  /* ===== SLOGAN ===== */
  .slogan{
    font-family:'Rajdhani',sans-serif;font-weight:600;
    margin-top:22px;letter-spacing:.5px;font-size:clamp(15px,4vw,18px);
    color:var(--blue-3);max-width:300px;font-style:italic;
    animation:fadeUp .8s .25s both;
  }

  /* ===== MENU / LINKS ===== */
  .links{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:15px;}
  .btn{
    --c:var(--blue);
    position:relative;display:flex;align-items:center;gap:15px;
    width:100%;padding:16px 18px;
    border:1px solid var(--card-brd);border-radius:18px;
    background:var(--card);
    color:var(--ink);text-decoration:none;
    font-weight:600;font-size:16px;letter-spacing:.3px;
    overflow:hidden;cursor:pointer;isolation:isolate;
    box-shadow:0 6px 18px -10px rgba(20,102,255,.45);
    transition:transform .25s cubic-bezier(.2,.9,.2,1), box-shadow .3s, border-color .3s;
    opacity:0;transform:translateY(14px);
    animation:fadeUp .6s forwards;
  }
  .btn:nth-of-type(1){animation-delay:.45s;}
  .btn:nth-of-type(2){animation-delay:.55s;}
  .btn:nth-of-type(3){animation-delay:.65s;}
  .btn::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 12px var(--c);transform:scaleY(.4);opacity:.7;transition:transform .3s,opacity .3s;}
  .btn::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;z-index:-1;background:linear-gradient(120deg,transparent,rgba(20,102,255,.10),transparent);transform:skewX(-20deg);transition:left .6s;}
  .btn:hover,.btn:focus-visible,.btn.demo{
    transform:translateY(-3px);
    border-color:var(--c);
    box-shadow:0 0 24px -4px var(--c),0 14px 30px -12px rgba(20,102,255,.5);
  }
  .btn:hover::after,.btn:focus-visible::after,.btn.demo::after{transform:scaleY(1);opacity:1;}
  .btn:hover::before,.btn:focus-visible::before,.btn.demo::before{left:130%;}
  .btn:active{transform:translateY(-1px) scale(.99);}

  .btn .ico{
    flex:0 0 46px;height:46px;display:grid;place-items:center;
    border-radius:14px;font-size:22px;
    background:rgba(20,102,255,.07);
    border:1px solid rgba(20,102,255,.12);
    box-shadow:0 0 16px -8px var(--c);
    transition:transform .35s, box-shadow .35s;
  }
  .btn:hover .ico,.btn.demo .ico{transform:scale(1.12) rotate(-6deg);box-shadow:0 0 18px -4px var(--c);}
  .btn .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.18;text-align:left;}
  .btn .txt small{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.5px;margin-top:2px;}
  .btn .arrow{margin-left:auto;font-size:17px;color:var(--muted);transition:transform .3s,color .3s;}
  .btn:hover .arrow,.btn.demo .arrow{transform:translateX(4px);color:var(--c);}

  /* cores por botão */
  .btn.spotify{--c:#1ed760;}
  .btn.yt{--c:#ff3b30;}
  .btn.zap{--c:#14a44d;}

  /* ===== RODAPÉ ===== */
  .foot{margin-top:auto;padding-top:30px;color:var(--muted);font-size:12px;letter-spacing:1px;animation:fadeUp .8s .9s both;}
  .foot b{color:var(--blue);font-family:'Orbitron',sans-serif;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* moldura "celular" só em telas grandes */
  @media (min-width:560px){
    body{align-items:center;padding:24px 0;background:linear-gradient(160deg,#dbeafe,#eff6ff);}
    .phone{
      min-height:auto;border-radius:40px;
      border:1px solid rgba(20,102,255,.18);
      box-shadow:0 30px 80px -24px rgba(20,102,255,.45),0 0 0 1px rgba(255,255,255,.6);
      background:var(--bg2);
      padding-bottom:34px;
    }
  }
</style>
</head>
<body>
  <div class="bg-layer">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="grid"></div>
  </div>

  <main class="phone">
    <div class="logo">
      <div class="l1">Endrick</div>
      <div class="l2">O Pirata</div>
    </div>

    <div class="photo-wrap">
      <span class="pulse"></span>
      <span class="pulse d2"></span>
      <img src="assets/avatar.jpg" alt="Endrick O Pirata"
           onerror="this.remove();const w=document.querySelector('.photo-wrap');w.classList.add('noimg');w.insertAdjacentHTML('afterbegin','<div class=ph><b>🏴‍☠️</b>sua foto<br>aqui</div>');" />
      <span class="live">NOVO 1.0</span>
      <span class="eq"><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <p class="slogan">"O Pirata dos Paredões!"</p>

    <nav class="links">
      <a class="btn spotify" href="https://open.spotify.com/intl-pt/artist/026iBsZ1iNQn6oZ7Bg1Kyh" target="_blank" rel="noopener">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="#1ed760" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.32c-.21.34-.66.45-1 .24-2.74-1.67-6.19-2.05-10.25-1.12-.39.09-.78-.15-.87-.55-.09-.39.15-.78.55-.87 4.44-1.01 8.26-.58 11.33 1.3.35.21.46.66.24 1zm1.47-3.27c-.27.43-.84.57-1.27.3-3.13-1.93-7.9-2.48-11.6-1.36-.49.15-1-.13-1.15-.61-.15-.49.13-1 .61-1.15 4.23-1.28 9.49-.67 13.09 1.55.43.27.57.84.3 1.27zm.13-3.4C15.35 8.4 8.7 8.18 4.94 9.32c-.58.18-1.2-.15-1.38-.73-.18-.58.15-1.2.73-1.38 4.32-1.31 11.66-1.06 16.26 1.67.52.31.69.99.38 1.51-.31.52-.99.69-1.51.38z"/></svg></span>
        <span class="txt">Escute agora no Spotify<small>Ouça o Pirata · Spotify</small></span>
        <span class="arrow">↗</span>
      </a>

      <a class="btn yt" href="https://www.youtube.com/watch?v=DHjuvfYxic8&t=1298s" target="_blank" rel="noopener">
        <span class="ico">▶</span>
        <span class="txt">Assista o audiovisual<small>YouTube</small></span>
        <span class="arrow">↗</span>
      </a>

      <a class="btn zap" href="https://wa.me/5573981381276?text=Ol%C3%A1%20gostaria%20de%20contratar%20um%20show%20do%20Endrick%20O%20Pirata" target="_blank" rel="noopener">
        <span class="ico">🎤</span>
        <span class="txt">Contratar show do Pirata<small>Fale direto no WhatsApp</small></span>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <footer class="foot">© <span id="ano"></span> <b>ENDRICK O PIRATA</b> · Todos os direitos reservados</footer>
  </main>

  <script>
    document.getElementById('ano').textContent = new Date().getFullYear();

    // Auto-demo: ~3s depois de abrir, passa um brilho por cada botao em sequencia
    if (!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
      const btns = [...document.querySelectorAll('.btn')];
      setTimeout(()=>{
        btns.forEach((b,i)=>{
          setTimeout(()=>{
            b.classList.add('demo');
            setTimeout(()=>b.classList.remove('demo'), 650);
          }, i*260);
        });
      }, 3000);
    }

    if (window.matchMedia('(hover:hover)').matches){
      document.querySelectorAll('.btn').forEach(b=>{
        b.addEventListener('mousemove',e=>{
          const r=b.getBoundingClientRect();
          const x=(e.clientX-r.left)/r.width-.5;
          b.style.transform=`translateY(-3px) perspective(600px) rotateY(${x*4}deg)`;
        });
        b.addEventListener('mouseleave',()=>{b.style.transform='';});
      });
    }
  </script>
</body>
</html>
